<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'includes/meta.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site-nav.css') }}?v=pay-fail">
    <style>
        body.booking-layout { background: #fff; }
        body.booking-layout #homePreviewNav { z-index: 9999 !important; }
        body.booking-layout,
        body.booking-layout * {
            font-family: var(--font-sans, "Source Sans Pro"), sans-serif !important;
            font-feature-settings: normal;
        }
        body.booking-layout {
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        html:has(#booking-modal:not(.hidden)),
        body:has(#booking-modal:not(.hidden)) {
            overflow: hidden !important;
            width: 100% !important;
            max-width: 100% !important;
            position: relative !important;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="booking-layout">
    {% include 'includes/nav.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>
    {% block modal %}{% endblock %}

    {% include 'includes/footer.html' %}

    <script type="module" src="{{ url_for('static', filename='js/home-preview-nav.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
