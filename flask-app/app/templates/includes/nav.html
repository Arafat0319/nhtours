{# 全站主导航 — Modern V1 浅色实底；旧版见 includes/legacy/nav_classic.html #}
{% set home_url = url_for('main.index') %}
{% set is_home = request.endpoint == 'main.index' %}
<nav class="home-preview-nav" id="homePreviewNav" aria-label="Primary">
	<div class="home-preview-nav__desktop">
		<a class="home-preview-nav__logo" href="{{ home_url }}">
			<img class="home-preview-nav__logo-img" id="homePreviewNavLogo"
				src="{{ url_for('static', filename='images/icons/logo-2-dark.svg') }}"
				alt="Nexus Horizons" width="220" height="50" />
		</a>
		<ul class="home-preview-nav__links">
			<li>
				<a class="home-preview-nav__link{% if is_home %} is-active{% endif %}" href="{{ home_url }}"
					{% if is_home %}aria-current="page"{% endif %}>Home</a>
			</li>
			<li>
				<a class="home-preview-nav__link" href="{{ url_for('main.asia_educational') }}">Students</a>
			</li>
			<li>
				<a class="home-preview-nav__link" href="{{ url_for('main.asia_family') }}">Family</a>
			</li>
			<li>
				<a class="home-preview-nav__link" href="{{ url_for('main.asia_business') }}">Business</a>
			</li>
		</ul>
		<a class="home-preview-nav__cta" href="{{ url_for('main.contact') }}">Contact Us &rarr;</a>
	</div>

	<div class="home-preview-nav__mobile">
		<div class="home-preview-nav__mobile-bar">
			<a class="home-preview-nav__logo home-preview-nav__logo--mobile" href="{{ home_url }}">
				<img class="home-preview-nav__logo-img home-preview-nav__logo-img--mobile"
					src="{{ url_for('static', filename='images/icons/logo-2-dark.svg') }}"
					alt="Nexus Horizons" width="160" height="36" />
			</a>
			<button class="home-preview-nav__toggle" id="homePreviewNavToggle" type="button"
				aria-expanded="false" aria-controls="homePreviewNavPanel" aria-label="Toggle menu">
				<svg class="home-preview-nav__toggle-icon" id="homePreviewNavOpen" fill="none" stroke="currentColor"
					viewBox="0 0 24 24" aria-hidden="true">
					<path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
				</svg>
				<svg class="home-preview-nav__toggle-icon home-preview-nav__toggle-icon--hidden" id="homePreviewNavClose"
					fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
					<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
				</svg>
			</button>
		</div>
		<div class="home-preview-nav__panel" id="homePreviewNavPanel" hidden>
			<a class="home-preview-nav__panel-link{% if is_home %} is-active{% endif %}" href="{{ home_url }}">Home</a>
			<a class="home-preview-nav__panel-link" href="{{ url_for('main.asia_educational') }}">Students</a>
			<a class="home-preview-nav__panel-link" href="{{ url_for('main.asia_family') }}">Family</a>
			<a class="home-preview-nav__panel-link" href="{{ url_for('main.asia_business') }}">Business</a>
			<a class="home-preview-nav__cta home-preview-nav__cta--panel" href="{{ url_for('main.contact') }}">Contact Us &rarr;</a>
		</div>
	</div>
</nav>
