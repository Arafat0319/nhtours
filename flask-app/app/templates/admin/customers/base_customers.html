{% extends "admin/base_wetravel.html" %}

{% block sidebar %}
<nav class="admin-sidebar-nav space-y-1" aria-label="Customers">
    <a href="{{ url_for('admin.customers') }}"
        class="group flex items-center px-3 py-3 min-h-[44px] text-sm font-medium rounded-md {% if 'customers' in request.endpoint and 'testimonials' not in request.endpoint and 'leads' not in request.endpoint %}bg-gray-100 text-wetravel-cyan{% else %}text-gray-600 hover:text-wetravel-cyan hover:bg-gray-50{% endif %}">
        Customers
    </a>
    <a href="{{ url_for('admin.leads') }}"
        class="group flex items-center px-3 py-3 min-h-[44px] text-sm font-medium rounded-md {% if 'leads' in request.endpoint %}bg-gray-100 text-wetravel-cyan{% else %}text-gray-600 hover:text-wetravel-cyan hover:bg-gray-50{% endif %}">
        Leads
    </a>
    <a href="{{ url_for('admin.testimonials') }}"
        class="group flex items-center px-3 py-3 min-h-[44px] text-sm font-medium rounded-md {% if 'testimonials' in request.endpoint %}bg-gray-100 text-wetravel-cyan{% else %}text-gray-600 hover:text-wetravel-cyan hover:bg-gray-50{% endif %}">
        Testimonials
    </a>
</nav>
{% endblock %}
