<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>{{ subject_line }}</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;">
	<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3f4f6;padding:24px 12px;">
		<tr>
			<td align="center">
				<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e5e7eb;">
					<tr>
						<td style="background:#0f172a;padding:20px 28px;">
							<p style="margin:0;font-size:18px;font-weight:700;color:#ffffff;letter-spacing:0.02em;">Nexus Horizons Tours</p>
							<p style="margin:6px 0 0;font-size:13px;color:#94a3b8;">{{ brand_subtitle }}</p>
						</td>
					</tr>

					{% block content %}{% endblock %}

					<tr>
						<td style="padding:24px 28px;border-top:1px solid #e5e7eb;background:#fafafa;">
							<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
								<tr>
									<td valign="middle" style="padding-right:12px;">
										<p style="margin:0 0 8px;font-size:13px;color:#6b7280;line-height:1.5;">
											{% block footer_note %}This notification was sent to your team inbox.{% endblock %}
										</p>
										<p style="margin:0;font-size:12px;color:#9ca3af;">
											Nexus Horizons Tours · <a href="https://nhtours.com" style="color:#9ca3af;text-decoration:none;">nhtours.com</a>
										</p>
									</td>
									{% if email_logo_url %}
									<td valign="middle" align="right" width="140" style="width:140px;">
										<a href="https://nhtours.com" style="text-decoration:none;border:0;">
											<img src="{{ email_logo_url }}"
												 width="120"
												 height="50"
												 alt="Nexus Horizons"
												 style="display:block;width:120px;height:auto;border:0;outline:none;text-decoration:none;">
										</a>
									</td>
									{% endif %}
								</tr>
							</table>
						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</body>
</html>
