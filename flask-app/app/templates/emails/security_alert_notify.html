{% extends "emails/admin_notify_base.html" %}

{% block content %}
<tr>
	<td style="padding:28px 28px 8px;">
		<p style="margin:0 0 8px;font-size:20px;font-weight:700;color:#111827;line-height:1.3;">
			{{ headline }}
		</p>
		<p style="margin:0;font-size:14px;color:#6b7280;line-height:1.5;">
			{{ intro }}
		</p>
	</td>
</tr>

<tr>
	<td style="padding:16px 28px 8px;">
		<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;">
			<tr>
				<td style="padding:16px 18px;">
					<p style="margin:0 0 4px;font-size:12px;color:#c2410c;text-transform:uppercase;letter-spacing:0.04em;font-weight:600;">Security alert</p>
					<p style="margin:0;font-size:16px;font-weight:700;color:#9a3412;line-height:1.3;">{{ alert_subject }}</p>
				</td>
			</tr>
		</table>
	</td>
</tr>

<tr>
	<td style="padding:8px 28px 24px;">
		<p style="margin:0 0 10px;font-size:13px;font-weight:700;color:#111827;text-transform:uppercase;letter-spacing:0.04em;">Details</p>
		<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;">
			<tr>
				<td style="padding:16px 18px;font-size:13px;color:#374151;line-height:1.55;white-space:pre-wrap;font-family:Consolas,Monaco,monospace;">{{ alert_body }}</td>
			</tr>
		</table>
	</td>
</tr>
{% endblock %}

{% block footer_note %}
Security notification for administrators. Investigate promptly if unexpected.
{% endblock %}
