# 仅部署：push 到 main 后自动部署到服务器（无 CI，本地自测）
name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            DEPLOY_ROOT=/var/www/nhtours
            # 必须与 systemd nhtours.service 一致（gunicorn 用 flask-app/venv，不是仓库根 venv）
            VENV="$DEPLOY_ROOT/flask-app/venv"
            cd "$DEPLOY_ROOT"
            git config --global --add safe.directory "$DEPLOY_ROOT" || true
            # 热修/sudo 可能把模板改成 www-data，导致 reset 无法 unlink
            sudo chown -R "$(whoami):$(whoami)" \
              "$DEPLOY_ROOT/.git" \
              "$DEPLOY_ROOT/context" \
              "$DEPLOY_ROOT/flask-app/app" \
              "$DEPLOY_ROOT/手册" \
              2>/dev/null || true
            # Prune/force fetch avoids origin/main ref lock errors when deploy races manual git on server
            git remote prune origin 2>/dev/null || true
            git fetch --force --prune origin main
            git reset --hard origin/main
            if [ ! -x "$VENV/bin/python" ]; then
              python3 -m venv "$VENV"
            fi
            PYTHON="$VENV/bin/python"
            "$PYTHON" -m pip install -q --upgrade pip
            if [ -f flask-app/requirements.txt ]; then
              "$PYTHON" -m pip install -q -r flask-app/requirements.txt
            else
              "$PYTHON" -m pip install -q -r requirements.txt
            fi
            # 收据 PDF：强制安装并校验 import，失败则让 Deploy 红灯（避免静默回退 HTML）
            "$PYTHON" -m pip install --force-reinstall -q "fpdf2==2.8.3"
            "$PYTHON" -c "from fpdf import FPDF; print('fpdf_ok', getattr(FPDF, '__module__', 'fpdf'))"
            cd "$DEPLOY_ROOT/flask-app"
            PYTHONPATH=. "$PYTHON" -c "from app.receipt_pdf import build_booking_receipt_pdf; print('receipt_pdf_ok')"
            set -a
            if [ -f "$DEPLOY_ROOT/flask-app/.env" ]; then
              . "$DEPLOY_ROOT/flask-app/.env"
            elif [ -f "$DEPLOY_ROOT/.env" ]; then
              . "$DEPLOY_ROOT/.env"
            fi
            set +a
            export FLASK_APP=wsgi.py
            export FLASK_ENV=production
            "$PYTHON" -m flask db upgrade
            sudo bash "$DEPLOY_ROOT/deploy/security/setup_audit_log.sh" || true
            sudo systemctl restart nhtours || true
            echo "Deploy done."
