# 仅部署：push 到 main 后自动部署到服务器（无 CI，本地自测）
name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            DEPLOY_ROOT=/var/www/nhtours
            VENV="$DEPLOY_ROOT/venv"
            cd "$DEPLOY_ROOT"
            git fetch origin main
            git reset --hard origin/main
            if [ ! -x "$VENV/bin/python" ]; then
              python3 -m venv "$VENV"
            fi
            PYTHON="$VENV/bin/python"
            "$PYTHON" -m pip install -q --upgrade pip
            if [ -f flask-app/requirements.txt ]; then
              "$PYTHON" -m pip install -q -r flask-app/requirements.txt
            else
              "$PYTHON" -m pip install -q -r requirements.txt
            fi
            set -a
            if [ -f "$DEPLOY_ROOT/.env" ]; then
              . "$DEPLOY_ROOT/.env"
            fi
            set +a
            export FLASK_APP=wsgi.py
            export FLASK_ENV=production
            cd "$DEPLOY_ROOT/flask-app"
            "$PYTHON" -m flask db upgrade
            sudo systemctl restart nhtours || true
            echo "Deploy done."
